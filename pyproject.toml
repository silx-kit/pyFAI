[project]
name = 'pyFAI'
dynamic = ['version',]
license = {file = 'copyright'}
requires-python = '>=3.10'
readme = 'README.md'
description = 'Python implementation of fast azimuthal integration'
authors = [
  { name = 'Jérôme Kieffer', email = 'jerome.kieffer@esrf.fr'},
  { name = 'Edgar Gutierrez Fernandez', email = 'edgar.gutierrez-fernandez@esrf.fr'},
  { name = 'Valentin Valls', email = 'valentin.valls@esrf.fr'},
  { name = 'Loïc Huder', email = 'loic.huder@esrf.fr'},
]

# double check classifiers on https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers = ["Development Status :: 5 - Production/Stable",
               "Intended Audience :: Developers",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
               "Programming Language :: Python :: 3.14",
               "Programming Language :: Python :: Implementation :: CPython",
               "Programming Language :: Cython",
               "Environment :: Console",
               "Environment :: X11 Applications :: Qt",
               "Intended Audience :: Science/Research",
               "License :: OSI Approved :: MIT License",
               "Topic :: Software Development :: Libraries :: Python Modules",
               "Operating System :: Microsoft :: Windows",
               "Operating System :: Unix",
               "Operating System :: MacOS :: MacOS X",
               "Operating System :: POSIX",
               "Topic :: Scientific/Engineering :: Physics"
               ]

dependencies = [
   'numpy>=1.10',
   'h5py',
   'fabio',
   'silx>=2',
   'numexpr != 2.8.6',
   'scipy',
   'matplotlib',
]

[build-system]
build-backend = 'mesonpy'
requires = [
    'meson-python>=0.11',
    "meson>=1.1",
    'ninja',
    'wheel',
    'oldest-supported-numpy',
    'Cython>=0.29.31',
    'pyproject-metadata>=0.5.0',
    "tomli>=1.0.0; python_version < '3.11'"
]

[project.optional-dependencies]
gui = [ "PySide6", "qtawesome" ]
opencl = [ "pyopencl" ]
all = ["PySide6", "pyopencl", "hdf5plugin", "qtawesome"]

[project.urls]
homepage = 'http://www.silx.org'
documentation = 'http://www.silx.org/doc/pyFAI/latest/'
source = 'https://github.com/silx-kit/pyFAI'
download = 'https://github.com/silx-kit/pyFAI/releases'
tracker = 'https://github.com/silx-kit/pyFAI/issues'

[project.scripts]
check_calib = 'pyFAI.app.check_calib:main'
detector2nexus = 'pyFAI.app.detector2nexus:main'
diff_map = 'pyFAI.app.diff_map:main'
diff_tomo = 'pyFAI.app.diff_tomo:main'
eiger-mask = 'pyFAI.app.eiger_mask:main'
MX-calibrate = 'pyFAI.app.mx_calibrate:main'
pyFAI-average = 'pyFAI.app.average:main'
pyFAI-benchmark = 'pyFAI.app.benchmark:main'
pyFAI-calib = 'pyFAI.app.calib:main'
pyFAI-recalib = 'pyFAI.app.recalib:main'
pyFAI-saxs = 'pyFAI.app.saxs:main'
pyFAI-waxs = 'pyFAI.app.waxs:main'
sparsify-Bragg = 'pyFAI.app.sparsify:main'
peakfinder = 'pyFAI.app.peakfinder:main'
# Windows application must NOT be in gui-script to be able to call for help. See #2815
#[project.gui-scripts]
pyFAI-calib2 = 'pyFAI.app.calib2:main'
pyFAI-drawmask = 'pyFAI.app.drawmask:main'
pyFAI-diffmap = 'pyFAI.app.diff_map:main'
pyFAI-integrate = 'pyFAI.app.integrate:main'
pyFAI-diffmap-view = 'pyFAI.app.pilx:main'


[tool.cibuildwheel]
# Skip 32-bit builds and PyPy
skip = ["*-win32", "*-manylinux_i686", "pp*", "*musllinux*"]

[tool.coverage.run]
branch = true

[tool.coverage.report]

ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.ruff]
line-length = 127
target-version = "py311"
extend-exclude = [
    "build",
    "doc/source/tutorials",  # notebooks rely on IPython magics (%%cython, %pylab, ...)
    "sandbox",               # playground scripts, excluded from releases (see .gitattributes)
]

[tool.ruff.lint]
# Explicit rule list: only rules the code base actually complies with are
# enforced, so `ruff check` stays green and meaningful in CI.
select = [
    "E4", "E7", "E9",        # pycodestyle errors (ruff defaults)
    "F",                     # pyflakes
    "UP028",                 # yield from
    "UP031",                 # printf-style %-formatting
    "UP036",                 # outdated python version blocks
    "C4",                    # flake8-comprehensions (literals over calls)
    "SIM102", "SIM103",      # collapsible if / needless bool
    "SIM113",                # use enumerate
    "SIM115",                # open() without context manager (deliberate cases carry noqa)
    "SIM117",                # collapsible with
    "SIM118", "SIM401",      # dict .keys() / .get() idioms
    "PIE810",                # startswith called with a tuple
    "LOG015",                # no call on the root logger
    "G201", "G202",          # logger.exception over error(exc_info=True)
    "EXE",                   # shebang and executable-bit consistency (see ignore)
    "PLE",                   # pylint errors (format-string and raise misuse)
    "TRY201", "TRY203",      # bare raise to re-raise
    "RUF012",                # mutable class attributes need ClassVar
    "RUF046", "RUF059",      # useless int() cast / unused unpacked variable
]
ignore = [
    "EXE001",  # many library modules keep a historical shebang without exec bit
]
# Rules considered and deliberately NOT enabled:
# - BLE001 (blind except): catching Exception is intentional in the format
#   probing and best-effort decoding paths.
# - TRY002/TRY003 (custom exception classes, message style): historical API,
#   callers rely on the current exception types.
# - N999 (module naming): GEimage, OXDimage, TiffIO... are public API names.
# - S1xx (bandit): exec() in bootstrap.py and try/except/pass are deliberate.
# - DTZ (naive datetimes): detector timestamps carry no timezone information.

[tool.ruff.lint.per-file-ignores]
# Re-exports forming the public API
"src/fabio/__init__.py" = ["F401"]

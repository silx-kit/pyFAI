# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
#    -   id: check-added-large-files

    # Ruff 0.16 or later is required: the rule selection in pyproject.toml
    # relies on rules and fixes introduced in that series. `rev` is an exact
    # pin, so bump it rather than lowering it.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    # Run the linter.
    -   id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
        files: ^src/
    # Run the formatter: deliberately disabled, see CONTRIBUTING.md — bulk
    # reformatting is only accepted from a file's main author.
    #-   id: ruff-format
    #    types_or: [ python, pyi ]
